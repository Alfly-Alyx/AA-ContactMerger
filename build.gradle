// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    flatDir {
        dirs 'libs'
    }
}

apply plugin: 'com.android.application'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

dependencies {
    implementation 'com.tundem.aboutlibraries:library:2.0.3@aar'
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.ow2.asm:asm:4.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'com.esotericsoftware.kryo:kryo:2.24.0'
    implementation files('libs/lucene-core-4.7.1-android.jar')
    implementation 'org.apache.lucene:lucene-misc:4.7.1'
    implementation 'org.apache.lucene:lucene-queries:4.7.1'
    implementation 'org.apache.lucene:lucene-analyzers-common:4.7.1'
    implementation 'org.apache.lucene:lucene-codecs:4.7.1'
}

configurations.configureEach {
    // The local Lucene core omits SPIClassIterator so the Android-specific
    // implementation in src/ can load service definitions from app assets.
    exclude group: 'org.apache.lucene', module: 'lucene-core'
}

android {
    namespace = "com.alyx.contactmerger"
    compileSdk 36
    defaultConfig {
        applicationId "com.alyx.contactmerger"
        minSdk 23
        targetSdk 36
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/services/org.apache.lucene.codecs.Codec', 'META-INF/services/org.apache.lucene.codecs.PostingsFormat', 'META-INF/services/org.apache.lucene.codecs.DocValuesFormat']
            pickFirsts += ['org/apache/lucene/util/SPIClassIterator.class']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src', 'aidl']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    signingConfigs {
        release { }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    def signingPropertiesFile = rootProject.file('signing.properties')
    def signingProperties = new Properties()
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }

    if (!signingProperties.isEmpty()) {
        android.signingConfigs.release.storeFile = rootProject.file(signingProperties.getProperty('storeFile'))
        android.signingConfigs.release.storePassword = signingProperties.getProperty('storePassword')
        android.signingConfigs.release.keyPassword = signingProperties.getProperty('keyPassword')
        android.signingConfigs.release.keyAlias = signingProperties.getProperty('keyAlias')
    } else {
        buildTypes.release.signingConfig = null
    }
}
